# ============================================================
#  杨梦婷给我学英语 · 更新源 —— GitHub Pages 自动部署
#
#  用法：把这个 workflows 文件（.github/workflows/deploy.yml）
#  和 manifest.js / words.js / gamedata.js / .nojekyll 一起
#  推到仓库根目录，然后在仓库 Settings → Pages 里把
#  Source 选为 "GitHub Actions"，即可自动发布。
# ============================================================
name: Deploy to GitHub Pages

on:
  # 推送到 main / master 分支时触发
  push:
    branches: ["main", "master"]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一个运行中的部署，避免互相覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          # 仓库根目录就是要发布的更新源（manifest.js 等在根目录）
          path: "."

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4